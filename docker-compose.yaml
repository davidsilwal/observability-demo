version: '3'
services:
  data-prepper:
    container_name: data-prepper
    image: opensearchproject/data-prepper:latest
    ports:
      - "21980:21980"
      - "21890:21890" #traces
      - "21891:21891" #metrics
      - "21892:21892" #logs
      - "2021:2021" #http
    volumes:
     - ./.config/data-prepper-pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml
     - ./.config/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      discovery.type: single-node
      node.name: opensearch
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: S9\V1ZeBc0(S
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    depends_on:
      - opensearch

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel.yaml" ]
    volumes:
      - ./.config/otel.yaml:/etc/otel.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
    depends_on:
      - data-prepper

volumes:
  opensearch_data: