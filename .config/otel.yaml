# Receivers
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317       
# Processors
processors:
  batch:

# Exporters
exporters:
  debug:
    verbosity: 
 
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    username: "<username>" # Optional if security is disabled
    password: "<password>" # Optional if security is disabled
    index: "otel-%{type}-%{YYYY.MM.dd}" # Dynamic index naming based on telemetry type
    logstash_format: true # Use Logstash-compatible format for logs

  # otlp:
  #       endpoint: "elasticsearch:8200"
# Pipelines
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]
    traces: 
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch] 
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]